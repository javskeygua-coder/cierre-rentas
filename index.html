<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4c400"><link rel="manifest" href="manifest.webmanifest"><title>Cierre Rentas Tango</title>
<style>:root{--y:#f4c400;--b:#111;--g:#f4f4f4;--r:#b42318}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#eee;color:#111}.top{background:var(--b);color:white;padding:18px 16px}.top b{color:var(--y);font-size:22px}.wrap{max-width:760px;margin:auto;padding:14px}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card,.panel{background:white;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 4px #0001}.n{font-size:24px;font-weight:800}.muted{color:#666;font-size:13px}label{font-size:13px;font-weight:700;display:block;margin-top:9px}input,select,textarea,button{width:100%;padding:11px;border:1px solid #bbb;border-radius:9px;font:inherit;background:white}button{background:var(--y);border:0;font-weight:800;margin-top:12px}.danger{background:#fff0ee;color:var(--r);padding:10px;border-radius:8px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.op{border-top:1px solid #ddd;padding:10px 0}.tag{font-size:12px;background:#eee;border-radius:999px;padding:3px 8px}.money{font-weight:800}.close{background:#111;color:white}.ok{color:#087a2f;font-weight:700}@media(min-width:650px){.cards{grid-template-columns:repeat(4,1fr)}}</style></head>
<body><header class="top"><b>Cierre Rentas Tango</b><div>Control diario de rentas y depósitos</div></header><main class="wrap">
<section class="cards"><div class="card"><div class="muted">Renta neta</div><div class="n" id="rentTotal">Q0</div></div><div class="card"><div class="muted">Q efectivo</div><div class="n" id="cashQ">Q0</div></div><div class="card"><div class="muted">Tarjeta neto</div><div class="n" id="cardQ">Q0</div></div><div class="card"><div class="muted">Operaciones</div><div class="n" id="opsN">0</div></div></section>
<section class="panel"><h3>Nueva renta</h3><div class="row"><div><label>Ticket</label><input id="ticket" inputmode="numeric"></div><div><label>Colaborador</label><input id="staff" placeholder="Ana"></div></div>
<label>Cliente</label><input id="client"><div class="row"><div><label>Agencia</label><input id="agency" placeholder="OX"></div><div><label>Renta neta (Q)</label><input id="rent" type="number" min="0"></div></div>
<label>Equipo / observaciones</label><textarea id="items"></textarea><div class="row"><div><label>Pick-up</label><input id="pickup" type="date"></div><div><label>Return</label><input id="ret" type="date"></div></div>
<label>Pago de renta</label><select id="payment"><option value="">Pendiente</option><option value="Q">Q efectivo</option><option value="USD">US$ efectivo</option><option value="EUR">€ efectivo</option><option value="CARD">Tarjeta (+10% al cobrar; cierre muestra neto)</option></select>
<div id="fxBox" style="display:none"><label>Efectivo extranjero recibido</label><input id="fxAmount" type="number" min="0" step=".01"></div>
<div class="row"><div><label>Moneda depósito</label><select id="depCur"><option value="Q">Q</option><option value="USD">US$</option><option value="EUR">€</option></select></div><div><label>Depósito (siempre efectivo)</label><input id="dep" type="number" min="0"></div></div>
<label><input id="after" type="checkbox" style="width:auto"> After Hours</label><button id="save">GUARDAR RENTA</button><div id="msg"></div></section>
<section class="panel"><h3>Operaciones de hoy</h3><div id="list"></div></section>
<section class="panel"><h3>Cierre</h3><div id="summary"></div><button class="close" id="close">GENERAR CIERRE</button></section>
</main>
<script>
const K='tango-rentals-v1'; let data=JSON.parse(localStorage.getItem(K)||'null')||[
{ticket:'002030',staff:'Jorge',client:'',agency:'G Adventures',rent:275,items:'Backpack 75L; Keen 8.5; Keen 10.5',pickup:'2026-09-21',ret:'2026-09-22',payment:'',fxAmount:0,depCur:'Q',dep:500,after:true},
{ticket:'002031',staff:'Ana',client:'Kate Edmunds',agency:'OX',rent:100,items:'2 pantalones para nieve',pickup:'2026-09-21',ret:'2026-09-23',payment:'Q',fxAmount:0,depCur:'Q',dep:200,after:false}
]; const $=id=>document.getElementById(id); function persist(){localStorage.setItem(K,JSON.stringify(data))}
$('payment').onchange=()=>{$('fxBox').style.display=['USD','EUR'].includes($('payment').value)?'block':'none'};
function totals(){let t={rent:0,q:0,card:0,usd:0,eur:0,dq:0,dusd:0,deur:0,pending:0};data.forEach(o=>{t.rent+=+o.rent||0;if(o.payment==='Q')t.q+=+o.rent||0;else if(o.payment==='CARD')t.card+=+o.rent||0;else if(o.payment==='USD')t.usd+=+o.fxAmount||0;else if(o.payment==='EUR')t.eur+=+o.fxAmount||0;else t.pending++; if(o.depCur==='Q')t.dq+=+o.dep||0;if(o.depCur==='USD')t.dusd+=+o.dep||0;if(o.depCur==='EUR')t.deur+=+o.dep||0});return t}
function render(){let t=totals();$('rentTotal').textContent='Q'+t.rent.toFixed(2);$('cashQ').textContent='Q'+t.q.toFixed(2);$('cardQ').textContent='Q'+t.card.toFixed(2);$('opsN').textContent=data.length;
$('list').innerHTML=data.map((o,i)=>'<div class="op"><b>#'+o.ticket+'</b> · '+(o.client||'Cliente pendiente')+' <span class="tag">'+(o.agency||'Sin agencia')+'</span><br><span class="money">Q'+(+o.rent).toFixed(2)+'</span> · '+(o.payment||'<b style="color:#b42318">PAGO PENDIENTE</b>')+' · Depósito '+o.depCur+' '+o.dep+' efectivo<br><span class="muted">'+o.items+' · '+o.staff+(o.after?' · After Hours':'')+'</span><button onclick="del('+i+')" style="background:#eee;margin-top:6px">Eliminar</button></div>').join('');
$('summary').innerHTML='<b>Rentas netas:</b> Q'+t.rent.toFixed(2)+'<br><b>Rentas Q efectivo:</b> Q'+t.q.toFixed(2)+'<br><b>Tarjeta (neto):</b> Q'+t.card.toFixed(2)+(t.usd?'<br><b>Renta efectivo US$:</b> US$'+t.usd.toFixed(2):'')+(t.eur?'<br><b>Renta efectivo €:</b> €'+t.eur.toFixed(2):'')+'<hr><b>Depósitos bajo custodia:</b> Q'+t.dq.toFixed(2)+' · US$'+t.dusd.toFixed(2)+' · €'+t.deur.toFixed(2)+(t.pending?'<div class="danger">⚠️ '+t.pending+' operación(es) con método de pago pendiente. No cerrar todavía.</div>':'<div class="ok">✓ Sin pagos pendientes</div>')}
window.del=i=>{if(confirm('¿Eliminar esta operación?')){data.splice(i,1);persist();render()}}
$('save').onclick=()=>{if(!$('ticket').value||!$('rent').value){$('msg').innerHTML='<div class="danger">Ticket y renta son obligatorios.</div>';return}let p=$('payment').value;if(['USD','EUR'].includes(p)&&!$('fxAmount').value){$('msg').innerHTML='<div class="danger">Ingresá el efectivo extranjero realmente recibido.</div>';return}data.push({ticket:$('ticket').value,staff:$('staff').value,client:$('client').value,agency:$('agency').value,rent:+$('rent').value,items:$('items').value,pickup:$('pickup').value,ret:$('ret').value,payment:p,fxAmount:+$('fxAmount').value||0,depCur:$('depCur').value,dep:+$('dep').value||0,after:$('after').checked});persist();['ticket','staff','client','agency','rent','items','pickup','ret','fxAmount','dep'].forEach(x=>$(x).value='');$('payment').value='';$('after').checked=false;$('fxBox').style.display='none';$('msg').innerHTML='<div class="ok">✓ Renta guardada</div>';render()}
$('close').onclick=()=>{let t=totals();if(t.pending){alert('No se puede cerrar: hay pagos pendientes.');return}alert('CIERRE\nRentas netas Q'+t.rent.toFixed(2)+'\nQ efectivo Q'+t.q.toFixed(2)+'\nTarjeta neto Q'+t.card.toFixed(2)+'\nDepósitos: Q'+t.dq.toFixed(2)+' / US$'+t.dusd.toFixed(2)+' / €'+t.deur.toFixed(2))}
persist();render(); if('serviceWorker'in navigator)navigator.serviceWorker.register('service-worker.js');
</script></body></html>
